name: Prism CI

on:
  push:
  pull_request:

jobs:
  strict-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Strict tests and platform builds
        run: ./scripts/check_build.sh
